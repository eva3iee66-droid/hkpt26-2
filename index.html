<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Take me</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #6c5ce7;
            --text-color: #2d3436;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 2.2em;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.95em;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .radio-group {
            display: flex;
            gap: 10px;
        }

        .radio-label {
            flex: 1;
            background: #f1f2f6;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 0.9em;
        }

        .radio-label:hover {
            background: #e4e7eb;
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked + span {
            font-weight: bold;
            color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:disabled {
            background-color: #b2bec3;
            cursor: not-allowed;
        }

        #result {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 30px 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px dashed var(--primary-color);
        }

        .success-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .thank-title {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .thank-desc {
            color: #636e72;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Please Take me</h1>
    <p class="subtitle">直屬抽籤配對小問卷<br>填寫你的音樂品味與性格，讓我們為你尋找最合拍的直屬！</p>

    <form id="quizForm">
        <div class="form-group">
            <label>1. 您的年級/身份：</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="role" value="大一" required>
                    <span>🌱 大一（學弟妹）</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="role" value="大二" required>
                    <span>🎓 大二（學長姐）</span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="studentId">2. 學號：</label>
            <input type="text" id="studentId" required placeholder="例如：U1140109">
        </div>

        <div class="form-group">
            <label for="name">3. 姓名：</label>
            <input type="text" id="name" required placeholder="例如：許大喬">
        </div>

        <div class="form-group">
            <label for="className">4. 班級：</label>
            <input type="text" id="className" required placeholder="例如：物治二甲">
        </div>

        <div class="form-group">
            <label>5. 你平常最主要偏好的音樂類型是？（8選1）</label>
            <select id="genre" required>
                <option value="">-- 請選擇音樂類型 --</option>
                <option value="INDIE">🎸 獨立樂團 / 聽團仔</option>
                <option value="KPOP">💃 K-POP / 韓國流行</option>
                <option value="HIPHOP">🎙️ 嘻哈 / 饒舌 / Trap</option>
                <option value="MANDOPOP">🎤 華語流行 / 經典金曲</option>
                <option value="WESTERN">🎧 歐美流行 / Electronic</option>
                <option value="JPOP">🌸 J-POP / 動漫 ACG 音樂</option>
                <option value="ROCK">⚡ 搖滾 / 重金屬 (Rock / Metal)</option>
                <option value="RNB">☕ R&B / 爵士 / Chill 靈魂樂</option>
            </select>
        </div>

        <div class="form-group">
            <label for="singers">6. 你平常比較喜歡聽誰的歌？（請舉出三位歌手/樂團）</label>
            <input type="text" id="singers" required placeholder="例如：草東沒有派對、告五人、IU">
        </div>

        <div class="form-group">
            <label for="songs">7. 你平常最喜歡的三首歌是？</label>
            <input type="text" id="songs" required placeholder="例如：爛泥、披星戴月的想你、Dynamite">
        </div>

        <div class="form-group">
            <label>8. 你自己是 I 人還是 E 人？</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="myMBTI" value="I" required>
                    <span>I 人（內向沉穩）</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="myMBTI" value="E" required>
                    <span>E 人（外向活潑）</span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label>9. 你希望你的直屬是 I 人還是 E 人？</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="targetMBTI" value="I" required>
                    <span>希望是 I 人</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="targetMBTI" value="E" required>
                    <span>希望是 E 人</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="targetMBTI" value="ANY" required>
                    <span>都好，隨緣！</span>
                </label>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">完成並送出問卷</button>
    </form>

    <div id="result">
        <div class="success-icon">🎉</div>
        <div class="thank-title">問卷已成功送出！</div>
        <p class="thank-desc">
            親愛的 <span id="userRole" style="font-weight:bold;"></span> <span id="userName" style="font-weight:bold;"></span>，我們已收到你的音樂品味與資料。<br><br>
            為了確保每組的直屬配對人數與氛圍達到最佳平衡，<b>最終分組結果將會在大家填寫完畢後統一公佈</b>！<br>
            敬請期待你的直屬出現喔！✨
        </p>
    </div>
</div>

<script>
    // ⚠️ 請替換為你在 Google Apps Script 部署獲得的 Web App URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxSgsljcmVkakdgrVmK-Kif1FTkufczQkwS6Zpo0UVurUONtvfRKa1zbz1RmVi901vzWQ/exec";

    document.getElementById('quizForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "資料傳送中...";

        const formData = {
            role: document.querySelector('input[name="role"]:checked').value,
            studentId: document.getElementById('studentId').value,
            name: document.getElementById('name').value,
            className: document.getElementById('className').value,
            genre: document.getElementById('genre').value,
            singers: document.getElementById('singers').value,
            songs: document.getElementById('songs').value,
            myMBTI: document.querySelector('input[name="myMBTI"]:checked').value,
            targetMBTI: document.querySelector('input[name="targetMBTI"]:checked').value
        };

        fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            document.getElementById('userRole').innerText = formData.role;
            document.getElementById('userName').innerText = formData.name;
            
            // 隱藏表單，顯示感謝與等待公佈畫面
            document.getElementById('quizForm').style.display = 'none';
            document.getElementById('result').style.display = 'block';
        })
        .catch(error => {
            alert("傳送失敗，請檢查網路連線後再試一次！");
            submitBtn.disabled = false;
            submitBtn.innerText = "完成並送出問卷";
        });
    });
</script>

</body>
</html>
